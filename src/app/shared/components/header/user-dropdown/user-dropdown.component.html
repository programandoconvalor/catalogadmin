<div class="relative">
  <!-- User Button -->
  <button
    class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400"
    (click)="toggleDropdown($event)"
    type="button"
  >
    @if (tenantLogoUrl()) {
      <img
        [src]="tenantLogoUrl()"
        [alt]="tenantName"
        class="ltr:mr-3 rtl:ml-3 h-11 w-11 shrink-0 rounded-full object-cover object-center"
        width="44"
        height="44"
        (error)="onTenantLogoError()"
      />
    } @else {
      <span
        class="ltr:mr-3 rtl:ml-3 flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-full bg-pink-50 text-pink-600 dark:bg-pink-950/40 dark:text-pink-300"
        aria-hidden="true"
      >
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="6.5" r="3.2" />
          <circle cx="17.2" cy="9.8" r="3.2" />
          <circle cx="15.2" cy="16" r="3.2" />
          <circle cx="8.8" cy="16" r="3.2" />
          <circle cx="6.8" cy="9.8" r="3.2" />
          <circle cx="12" cy="11.2" r="2.5" class="text-pink-500 dark:text-pink-200" />
        </svg>
      </span>
    }

    <span
      class="block font-medium ltr:mr-1 rtl:ml-1 text-theme-sm"
    >
      {{ displayName }}
    </span>

    <!-- Chevron Icon -->
    <svg
      class="transition-transform duration-200 size-5 text-gray-500 dark:text-gray-400"
      [ngClass]="{ 'rotate-180': isOpen }"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <!-- Dropdown Start -->
  @if (isOpen) {
    <div
      class="absolute ltr:right-0 rtl:left-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark z-50 animate-fadeIn"
    >
      <!-- User Info -->
      <div>
        <span
          class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400"
        >
          {{ tenantName }}
        </span>

        <span
          class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400"
        >
          {{ userEmail }}
        </span>

        @if (userRole) {
          <span
            class="mt-1 block text-theme-xs font-medium text-brand-500 dark:text-brand-400"
          >
            {{ userRole }}
          </span>
        }
      </div>

      <!-- Menu Items -->
      <ul
        class="flex flex-col gap-1 pt-4 pb-3 border-b border-gray-200 dark:border-gray-800"
      >
        

        <li>
  <a
    routerLink="/catalog/branding"
    (click)="closeDropdown()"
    class="group flex items-center gap-3 rounded-lg px-3 py-2 text-theme-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
  >
    <svg
      class="fill-none stroke-gray-500 group-hover:stroke-gray-700 dark:stroke-gray-400 dark:group-hover:stroke-gray-300"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <path d="M3 9h18M9 21V9" />
    </svg>

    Vista previa del catálogo
  </a>
</li>


      </ul>

      <!-- Sign Out -->
      <button
        type="button"
        (click)="onSignOut()"
           class="flex items-center justify-center p-3 font-medium text-white rounded-lg bg-brand-500 text-theme-sm hover:bg-brand-600"
      
      >
        Cerrar sesión
      </button>

    </div>
  }
</div>
