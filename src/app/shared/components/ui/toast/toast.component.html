<section
  class="toast-container pointer-events-none fixed z-[100000] flex max-w-sm flex-col gap-3"
  aria-label="Notificaciones"
>
  @for (
    notification of notificationService.notifications$ | async;
    track notification.id
  ) {
    <article
      class="toast-enter pointer-events-auto flex items-start gap-3 rounded-xl border border-s-4 border-gray-200 bg-white p-4 text-gray-700 shadow-theme-lg dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200"
      [ngClass]="[classesFor(notification.type), notification.dismissed ? 'toast-leave' : '']"
      [attr.role]="notification.type === 'error' ? 'alert' : 'status'"
      aria-atomic="true"
    >
      <span class="mt-0.5 shrink-0" aria-hidden="true">
        @switch (notification.type) {
          @case ('success') {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
              <path d="m8 12 2.5 2.5L16.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('error') {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
              <path d="m9 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          }
          @case ('warning') {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
              <path d="M10.3 4.6 2.9 17.4A1.8 1.8 0 0 0 4.5 20h15a1.8 1.8 0 0 0 1.6-2.6L13.7 4.6a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <path d="M12 9v4m0 3h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          }
          @default {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 11v5m0-8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          }
        }
      </span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-gray-800 dark:text-white/90">
          {{ notification.title }}
        </p>
        <p class="mt-1 break-words text-sm leading-5 text-gray-600 dark:text-gray-300">
          {{ notification.message }}
        </p>
      </div>
      <button
        type="button"
        class="-me-1 -mt-1 inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 dark:hover:bg-gray-800 dark:hover:text-white"
        aria-label="Cerrar notificación"
        (click)="dismiss(notification.id)"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>
    </article>
  }
</section>
